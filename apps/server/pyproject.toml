[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protohub"
version = "0.1.0"
description = "Local trusted-template prototype hosting"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2,<3", "pydantic-settings",
  "sqlalchemy>=2,<3", "alembic", "psycopg[binary]", "httpx", "kubernetes",
  "google-auth[requests]>=2,<3",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pyyaml", "types-PyYAML", "openapi-spec-validator", "build", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/protohub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: real PostgreSQL required"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

