services:
  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: protohub
      POSTGRES_PASSWORD: local-test
      POSTGRES_DB: protohub_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protohub -d protohub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test]
  tests:
    build:
      context: ../..
      dockerfile: scripts/checks/Dockerfile
    environment:
      PROTOHUB_TEST_DATABASE_URL: postgresql+psycopg://protohub:local-test@db/protohub_test
      PROTOHUB_DATABASE_URL: postgresql+psycopg://protohub:local-test@db/protohub_test
    depends_on:
      db: {condition: service_healthy}
    command: ["python3", "tests/integration/assertions.py"]
    volumes:
      - ${PROTOHUB_TEST_REPORT_DIR:?test report directory required}:/evidence
    networks: [test]
networks:
  test:
    internal: true
