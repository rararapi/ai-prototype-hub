# Requires a NetworkPolicy-enforcing CNI. Node-originated probes and kubectl
# port-forward use the trusted node/control plane, outside Pod ingress selectors.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: system-ingress, namespace: protohub-system}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: samples-default-deny, namespace: protohub-samples}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-from-web, namespace: protohub-system}
spec:
  podSelector: {matchLabels: {app: protohub-api, app.kubernetes.io/managed-by: protohub}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: protohub-web, app.kubernetes.io/managed-by: protohub}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: db-from-clients, namespace: protohub-system}
spec:
  podSelector: {matchLabels: {app: protohub-db, app.kubernetes.io/managed-by: protohub}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/managed-by: protohub}
            matchExpressions:
              - {key: app, operator: In, values: [protohub-api, protohub-worker, protohub-preview]}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sample-from-runtime, namespace: protohub-samples}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/managed-by: protohub}
    matchExpressions: [{key: protohub.io/sandbox-id, operator: Exists}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: protohub-system}}
          podSelector:
            matchLabels: {app.kubernetes.io/managed-by: protohub}
            matchExpressions:
              - {key: app, operator: In, values: [protohub-worker, protohub-preview]}
      ports: [{protocol: TCP, port: 8080}]
