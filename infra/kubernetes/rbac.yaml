apiVersion: v1
kind: ServiceAccount
metadata: {name: protohub-worker, namespace: protohub-system}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: protohub-worker, namespace: protohub-samples}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, create, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: protohub-worker, namespace: protohub-samples}
subjects:
  - {kind: ServiceAccount, name: protohub-worker, namespace: protohub-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: protohub-worker}
